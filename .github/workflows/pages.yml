name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Integrate commercial version
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          commercial_css = r'''
          /* Comercial */
          .commercial-hero{background:linear-gradient(135deg,#071522,#12324e);color:#fff;border-radius:22px;padding:28px;margin-bottom:18px}
          .commercial-hero .eyebrow{color:var(--orange2)}
          .commercial-hero h1{font-size:clamp(2.1rem,4vw,3.6rem);margin:8px 0 12px}
          .commercial-hero p{color:#c9d6e1;max-width:760px;margin:0}
          .commercial-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:18px 0}
          .commercial-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:250px}
          .commercial-card.selected{border:2px solid var(--orange);padding:20px;box-shadow:0 14px 36px #ff713825}
          .commercial-icon{width:58px;height:58px;border-radius:16px;background:#fff0e4;display:grid;place-items:center;font-size:1.9rem;margin-bottom:13px}
          .commercial-card h2{margin:0 0 6px}.commercial-card p{color:var(--muted);margin:0 0 14px;font-size:.9rem}.commercial-card ul{margin:0 0 18px;padding-left:19px;color:#46566a;font-size:.86rem}.commercial-card li{margin:5px 0}
          .commercial-card .orange{margin-top:auto;width:max-content}
          .commercial-plan{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:18px}
          .commercial-plan .panel{box-shadow:none}
          .commercial-plan h2{margin-top:0}.commercial-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}.commercial-list div{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
          .commercial-live{background:linear-gradient(145deg,#fff5ea,#fff);border:1px solid #f2d4bd;border-radius:16px;padding:18px}.commercial-live strong{display:block;font-size:1.5rem;color:var(--orange)}.commercial-live span{color:var(--muted);font-size:.85rem}
          .language-tabs{display:flex;gap:8px;margin:14px 0}.language-tabs button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 13px;font-weight:850}.language-tabs button.active{background:var(--orange);border-color:var(--orange);color:#fff}.language-panel{display:none}.language-panel.active{display:block}
          .commercial-note{font-size:.78rem;color:var(--muted);margin-top:10px}.commercial-cta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
          @media(max-width:850px){.commercial-grid,.commercial-plan{grid-template-columns:1fr}.commercial-list{grid-template-columns:1fr}}
          @media(max-width:640px){.commercial-hero{padding:21px}.commercial-card{min-height:auto}}
          '''
          if '/* Comercial */' not in html: html = html.replace('</style>', commercial_css + '</style>', 1)
          commercial_html = r'''
          <section id="view-comercial" class="view"><div class="wrap section"><div class="commercial-hero"><div class="eyebrow">VERSÃO COMERCIAL</div><h1>Uma jornada musical de 3 meses.</h1><p>Conteúdo em vídeo, materiais de apoio, evolução acompanhada e uma aula individual ao vivo por mês para orientar o aluno com proximidade.</p><div class="commercial-cta"><button class="orange" data-interest="comercial">Tenho interesse</button><span class="commercial-note" style="color:#c9d6e1">Protótipo comercial — valores finais ainda em definição.</span></div></div><div class="commercial-grid"><article class="commercial-card selected"><div class="commercial-icon">🪕</div><h2>Ukulele</h2><p>Aprendizado progressivo do instrumento, com prática orientada e repertório.</p><ul><li>Aulas em vídeo</li><li>Material de apoio</li><li>Evolução por habilidades</li></ul><button class="orange" data-interest="ukulele">Conhecer</button></article><article class="commercial-card"><div class="commercial-icon">🎸</div><h2>Violão</h2><p>Do fundamento ao repertório, conectando técnica, ritmo, acordes e musicalidade.</p><ul><li>Aulas em vídeo</li><li>Material de apoio</li><li>Prática orientada</li></ul><button class="orange" data-interest="violao">Conhecer</button></article><article class="commercial-card"><div class="commercial-icon">🎼</div><h2>Linguagem Musical</h2><p>Base musical organizada em duas frentes complementares.</p><div class="language-tabs"><button class="active" data-lang-tab="ritmica">Rítmica</button><button data-lang-tab="solfejo">Solfejo</button></div><div class="language-panel active" data-lang-panel="ritmica"><strong>Rítmica</strong><p>Leitura e percepção do pulso, subdivisões, compassos e exercícios rítmicos.</p></div><div class="language-panel" data-lang-panel="solfejo"><strong>Solfejo</strong><p>Leitura melódica, percepção das alturas e desenvolvimento da voz musical.</p></div><button class="orange" data-interest="linguagem-musical">Conhecer</button></article></div><div class="commercial-plan"><div class="panel"><h2>Plano de 3 meses</h2><p class="muted">A proposta comercial é um ciclo de aprendizagem, não apenas uma aula avulsa.</p><div class="commercial-list"><div>🎥 <strong>Aulas em vídeo</strong></div><div>📚 <strong>Material de apoio</strong></div><div>📈 <strong>Acompanhamento</strong></div><div>🎓 <strong>3 aulas individuais</strong></div></div><p class="commercial-note">Uma aula ao vivo por mês durante o ciclo de 3 meses.</p></div><div class="commercial-live"><span>Aula individual ao vivo</span><strong>45 minutos</strong><span>1 encontro por mês · comercializado como 1 hora-aula</span><div class="commercial-cta"><button class="orange" data-interest="plano-3-meses">Consultar plano</button></div></div></div><div id="commercialNotice" class="notice">Interesse registrado nesta demonstração. Próxima etapa: definir valor da hora-aula e fluxo real de contratação.</div></div></section>
          '''
          if 'id="view-comercial"' not in html: html = html.replace('</main>', commercial_html + '</main>', 1)
          nav_anchor='<div class="navlinks">'; nav_button='<button data-route="comercial">Comercial</button>'
          if nav_button not in html and nav_anchor in html: html=html.replace(nav_anchor,nav_anchor+nav_button,1)
          commercial_js=r'''
          document.querySelectorAll('[data-lang-tab]').forEach(function(btn){btn.addEventListener('click',function(){var key=this.getAttribute('data-lang-tab');document.querySelectorAll('[data-lang-tab]').forEach(function(b){b.classList.toggle('active',b===btn)});document.querySelectorAll('[data-lang-panel]').forEach(function(p){p.classList.toggle('active',p.getAttribute('data-lang-panel')===key)})})});
          document.querySelectorAll('[data-interest]').forEach(function(btn){btn.addEventListener('click',function(){var n=document.getElementById('commercialNotice');if(n)n.classList.add('show');if(typeof showView==='function')showView('comercial');window.scrollTo({top:0,behavior:'smooth'})})});
          '''
          pos=html.rfind('</script>')
          if pos<0: raise SystemExit('Script final não encontrado.')
          if 'data-interest' not in html[-5000:]: html=html[:pos]+commercial_js+html[pos:]
          old='<div class="brand"><span class="note">♪</span> APP <b>Música</b></div>'; new='<a class="brand brand-logo" href="#" data-route="home" aria-label="APP Música — Início"><img src="assets/app-musica-logo.svg" alt="APP Música" loading="eager"></a>'
          if old in html: html=html.replace(old,new,1)
          marker='<meta name="viewport" content="width=device-width,initial-scale=1">'; favicon='<link rel="icon" type="image/svg+xml" href="favicon.svg">'
          if favicon not in html: html=html.replace(marker,marker+favicon,1)
          html=html.replace('.brand{font-weight:900;font-size:1.25rem;white-space:nowrap}', '.brand{font-weight:900;font-size:1.25rem;white-space:nowrap}.brand-logo{display:flex;align-items:center;text-decoration:none}.brand-logo img{display:block;width:118px;height:48px;object-fit:cover;object-position:center;border-radius:8px}')
          p.write_text(html,encoding='utf-8')
      - name: Integrate shared commercial journey
        shell: python
        run: |
          from pathlib import Path
          script='<script src="assets/jornada-comercial.js"></script>'
          for name in ['comercial.html','aluno.html','agendamento.html','professor.html']:
              p=Path(name)
              html=p.read_text(encoding='utf-8')
              if script not in html:
                  html=html.replace('</body>',script+'</body>',1)
                  p.write_text(html,encoding='utf-8')
      - name: Integrate NEXA visual system
        shell: python
        run: |
          from pathlib import Path
          links=['<link rel="stylesheet" href="assets/nexa-app-musica.css">','<link rel="stylesheet" href="assets/app-musica-editorial-v2.css">','<link rel="stylesheet" href="assets/nexa-consistency-v5.css">','<link rel="stylesheet" href="assets/nexa-consistency-v5b.css">','<link rel="stylesheet" href="assets/nexa-commercial-v1.css">']
          credit='''<div class="nexa-credit"><div class="nexa-credit-label"><span class="nexa-mark">NEXA — STUDIO</span><span>Design · Tecnologia · Comunicação Visual</span></div><a href="https://github.com/sayjinblackbelt/NEXA-Studio" target="_blank" rel="noopener noreferrer">Powered by NEXA Studio ↗</a></div>'''
          pages=['index.html','comercial.html','aluno.html','professor.html','agendamento.html','gestao.html']
          for name in pages:
              p=Path(name)
              if not p.exists():
                  continue
              html=p.read_text(encoding='utf-8')
              for link in links:
                  if link not in html:
                      html=html.replace('</head>',link+'</head>',1)
              if 'class="nexa-credit"' not in html:
                  html=html.replace('</body>',credit+'</body>',1)
              p.write_text(html,encoding='utf-8')
      - name: Run flow smoke tests
        shell: bash
        run: |
          python3 -m http.server 4173 --directory . >/tmp/app-musica-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/smoke.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
