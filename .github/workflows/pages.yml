name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Integrate pixel-art brand
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          old = '<div class="brand"><span class="note">♪</span> APP <b>Música</b></div>'
          new = '<a class="brand brand-logo" href="#" data-route="home" aria-label="APP Música — Início"><img src="assets/app-musica-logo.svg" alt="APP Música" loading="eager"></a>'
          if old not in html:
              raise SystemExit('Marca textual esperada não encontrada; deploy interrompido para evitar alteração incorreta.')
          html = html.replace(old, new, 1)
          marker = '<meta name="viewport" content="width=device-width,initial-scale=1">'
          favicon = '<link rel="icon" type="image/svg+xml" href="favicon.svg">'
          if favicon not in html:
              html = html.replace(marker, marker + favicon, 1)
          html = html.replace('.brand{font-weight:900;font-size:1.25rem;white-space:nowrap}', '.brand{font-weight:900;font-size:1.25rem;white-space:nowrap}.brand-logo{display:flex;align-items:center;text-decoration:none}.brand-logo img{display:block;width:118px;height:48px;object-fit:cover;object-position:center;border-radius:8px}')
          p.write_text(html, encoding='utf-8')
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
