<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Aula de violão — troca de acordes</title>
<desc id="desc">Material visual demonstrativo para a aula de troca entre os acordes G e C.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#061321"/><stop offset="1" stop-color="#12324e"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#ff7138"/><stop offset="1" stop-color="#ffad55"/></linearGradient></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<text x="64" y="78" fill="#ffad55" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">APP MÚSICA · MATERIAL DA AULA</text>
<text x="64" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="800">Troca de acordes no violão</text>
<text x="64" y="168" fill="#cbd8e3" font-family="Arial,sans-serif" font-size="21">Pratique a passagem entre G e C com pulso constante.</text>
<g transform="translate(64 220)"><rect width="290" height="340" rx="20" fill="#fffdf9"/><text x="145" y="50" text-anchor="middle" fill="#14243a" font-family="Arial,sans-serif" font-size="30" font-weight="800">G</text><text x="145" y="80" text-anchor="middle" fill="#657286" font-family="Arial,sans-serif" font-size="16">Sol maior</text><g stroke="#14243a" stroke-width="3"><path d="M62 120h166M62 164h166M62 208h166M62 252h166M62 296h166M62 120v176M95 120v176M128 120v176M161 120v176M194 120v176M227 120v176"/></g><g fill="#14243a"><circle cx="95" cy="208" r="13"/><circle cx="62" cy="252" r="13"/><circle cx="227" cy="252" r="13"/></g><text x="145" y="322" text-anchor="middle" fill="#657286" font-family="Arial,sans-serif" font-size="14">E · A · D · G · B · E</text></g>
<g transform="translate(455 220)"><rect width="290" height="340" rx="20" fill="#fffdf9"/><text x="145" y="50" text-anchor="middle" fill="#14243a" font-family="Arial,sans-serif" font-size="30" font-weight="800">C</text><text x="145" y="80" text-anchor="middle" fill="#657286" font-family="Arial,sans-serif" font-size="16">Dó maior</text><g stroke="#14243a" stroke-width="3"><path d="M62 120h166M62 164h166M62 208h166M62 252h166M62 296h166M62 120v176M95 120v176M128 120v176M161 120v176M194 120v176M227 120v176"/></g><g fill="#14243a"><circle cx="161" cy="164" r="13"/><circle cx="128" cy="208" r="13"/><circle cx="95" cy="252" r="13"/></g><text x="145" y="322" text-anchor="middle" fill="#657286" font-family="Arial,sans-serif" font-size="14">E · A · D · G · B · E</text></g>
<g transform="translate(840 225)"><rect width="296" height="160" rx="20" fill="#ffffff12" stroke="#ffffff22"/><text x="24" y="42" fill="#ffad55" font-family="Arial,sans-serif" font-size="17" font-weight="800">RITMO · 60 BPM</text><text x="24" y="88" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="800">↓ ↓ ↑ ↑ ↓ ↑</text><text x="24" y="125" fill="#b9c7d4" font-family="Arial,sans-serif" font-size="17">Troque sem perder o pulso.</text></g>
<g transform="translate(840 410)"><circle cx="44" cy="44" r="44" fill="url(#accent)"/><path d="M36 27l29 17-29 17z" fill="#fff"/><text x="105" y="38" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="800">Prática guiada</text><text x="105" y="70" fill="#b9c7d4" font-family="Arial,sans-serif" font-size="16">G → C · 4 repetições</text></g>
<text x="64" y="625" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Pequenos passos. Grandes músicas.</text>
</svg>